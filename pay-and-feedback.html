<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pay & Feedback</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #f4f6f8;
  }
  .card {
    background: white;
    padding: 36px 28px;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 340px;
    width: 90%;
  }
  h2 { margin-top: 0; color: #222; }
  p { color: #555; font-size: 14px; line-height: 1.5; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 14px;
  }
  #pay-btn { background: #5f259f; color: white; } /* UPI purple */
  #confirm-btn { background: #2e7d32; color: white; display: none; }
  #confirm-btn.show { display: block; }
  .note { font-size: 12px; color: #999; margin-top: 18px; }
</style>
</head>
<body>

<div class="card">
  <h2>Complete Your Payment</h2>
  <p>Tap below to pay via any UPI app (Google Pay, PhonePe, Paytm, etc).</p>

  <button id="pay-btn">Pay Now</button>
  <button id="confirm-btn">I've Paid — Continue to Feedback</button>

  <p class="note">After paying, come back here and tap the green button to share your feedback.</p>
</div>

<script>
  const UPI_LINK = "upi://pay?pa=8861334770-3@ibl&pn=FUTURE%20FLOW&mc=0000&mode=02&purpose=00";
  const SURVEY_LINK = "https://sohan1305id-cmd.github.io/Clinic-feedback/";

  const payBtn = document.getElementById('pay-btn');
  const confirmBtn = document.getElementById('confirm-btn');

  payBtn.addEventListener('click', function () {
    // Opens the UPI app on the phone
    window.location.href = UPI_LINK;

    // We have no way to know if payment succeeded, so we simply
    // reveal a manual confirmation button after a short pause —
    // enough time for the UPI app to have opened.
    setTimeout(function () {
      confirmBtn.classList.add('show');
    }, 1500);
  });

  confirmBtn.addEventListener('click', function () {
    window.location.href = SURVEY_LINK;
  });
</script>

</body>
</html>
